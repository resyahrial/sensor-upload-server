# Single-VPS stack: upload server + PostgreSQL + MinIO (test/experiment server).
# Deployed to /srv/sensor-upload by `make vps-deploy` (deploy/vps/deploy.sh);
# see README "Deploy to a VPS" and docs/decisions.md "Decisions (vps)".
#
# - Devices authenticate with per-device keys stored in Postgres
#   (device_keys); create one with `make vps-device-key VPS=... VPS_DEVICE=...`
#   (runs /devicekey in the server container).
# - Secrets come from .env next to this file (generated by gen-secrets.sh,
#   never committed; see .env.example).
# - Published: 443/tcp + 443/udp (TLS, HTTP/3) and 9090/tcp (native gRPC).
#   Admin/metrics and the MinIO console bind to 127.0.0.1 only (SSH tunnel).
#   Postgres and MinIO S3 are not published at all. Docker publishes ports
#   past ufw, so anything published here is reachable from the internet.
# - Data lives in bind mounts under DATA_DIR (default /srv/sensor-upload),
#   created with the right owners by bootstrap.sh.
#
# Every host port/bind and DATA_DIR can be overridden from .env or the
# environment (used to boot this stack locally on other ports).
name: sensor-upload-vps

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-minio-image: &minio-image docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: upload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: upload
    # Small-VPS settings; the server uses a handful of pooled connections.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upload -d upload"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - ${DATA_DIR:-/srv/sensor-upload}/pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 200
    logging: *logging

  minio:
    # Upstream minio/minio images are no longer anonymously pullable; see docs/decisions.md.
    image: *minio-image
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      MINIO_BROWSER_REDIRECT: "off"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      # Console only, on loopback: ssh -L 9001:127.0.0.1:9001 <vps>.
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001/tcp"
    volumes:
      - ${DATA_DIR:-/srv/sensor-upload}/minio:/data
    deploy:
      resources:
        limits:
          memory: 768m
          pids: 500
    logging: *logging

  # Creates the bucket and a bucket-scoped MinIO user for the server (the
  # server never gets the root credentials). Idempotent; runs on every `up`.
  minio-init:
    image: *minio-image
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET"
        cat > /tmp/policy.json <<EOF
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],
           "Resource":["arn:aws:s3:::$$S3_BUCKET"]},
          {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],
           "Resource":["arn:aws:s3:::$$S3_BUCKET/*"]}]}
        EOF
        mc admin policy create local upload-server /tmp/policy.json
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        # Idempotent with this mc release (re-attaching succeeds).
        mc admin policy attach local upload-server --user "$$S3_ACCESS_KEY" >/dev/null
        echo "minio-init: bucket $$S3_BUCKET and user $$S3_ACCESS_KEY ready"
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

  server:
    image: ${SERVER_IMAGE:-localhost/sensor-upload-server:vps}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Lets the nonroot user bind :443 (Docker's default for bridge networks
    # already; explicit for other runtimes).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    environment:
      # Container ports match the published ones so Alt-Svc advertises :443.
      LISTEN_ADDR: ":443"
      GRPC_NATIVE_ADDR: ":9090"
      METRICS_ADDR: ":9100"
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /certs/server.key
      DATABASE_URL: postgres://upload:${POSTGRES_PASSWORD}@postgres:5432/upload?sslmode=disable
      STAGING_DIR: /data/staging
      TUS_STAGING: file
      OBJSTORE: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-524288000}
      INCOMPLETE_TTL: ${INCOMPLETE_TTL:-168h}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1h}
      # Retention and disk-pressure cleanup. DISK_PATH is the MinIO data
      # directory (read-only bind mount below), so the watermarks track the
      # filesystem that holds the stored objects.
      RETENTION_MAX_AGE: ${RETENTION_MAX_AGE:-168h}
      DISK_PATH: /data/disk
      DISK_HIGH_WATERMARK: ${DISK_HIGH_WATERMARK:-85}
      DISK_LOW_WATERMARK: ${DISK_LOW_WATERMARK:-70}
      DISK_CHECK_INTERVAL: ${DISK_CHECK_INTERVAL:-1m}
      # Below the container limit so the GC works harder before the OOM killer.
      GOMEMLIMIT: ${GOMEMLIMIT:-800MiB}
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/tcp"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
      - "${GRPC_BIND:-0.0.0.0}:${GRPC_PORT:-9090}:9090/tcp"
      # Plain-HTTP admin (/metrics, /healthz, /readyz): loopback only.
      - "${METRICS_BIND:-127.0.0.1}:${METRICS_PORT:-9100}:9100/tcp"
    volumes:
      - ${DATA_DIR:-/srv/sensor-upload}/certs:/certs:ro
      - ${DATA_DIR:-/srv/sensor-upload}/staging:/data/staging
      - ${DATA_DIR:-/srv/sensor-upload}/minio:/data/disk:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 40s # SHUTDOWN_TIMEOUT (30s) + margin
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 1000
    logging: *logging
