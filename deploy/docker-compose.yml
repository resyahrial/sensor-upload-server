# Local stack: upload server + PostgreSQL + MinIO.
# Start with `make up` (runs `make devcert` first), stop with `make down`.
# DEV ONLY: DEV_MODE + HS256, MinIO/Postgres default credentials, plain-HTTP
# admin port. Host ports are published on 127.0.0.1 only (HOST_BIND; set it to
# 0.0.0.0 only on a trusted network) and default to 18443 (TCP+UDP), 19090
# (native gRPC) and 19100; override with HOST_HTTPS_PORT / HOST_GRPC_PORT /
# HOST_METRICS_PORT.
# The network is named deploy_default (what deploy/netem expects; the server
# is reachable there as host "server"); override with COMPOSE_NETWORK to run
# a second stack next to this one (and SERVER_IMAGE to keep its image apart).
name: sensor-upload

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: upload
      POSTGRES_PASSWORD: upload
      POSTGRES_DB: upload
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upload -d upload"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    # Upstream minio/minio images are no longer anonymously pullable; see docs/decisions.md.
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio:/data

  minio-init:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/uploads
    restart: "no"

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${SERVER_IMAGE:-localhost/sensor-upload-server:dev}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      LISTEN_ADDR: ":8443"
      GRPC_NATIVE_ADDR: ":9090"
      METRICS_ADDR: ":9100"
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /certs/server.key
      DATABASE_URL: postgres://upload:upload@postgres:5432/upload?sslmode=disable
      STAGING_DIR: /data/staging
      OBJSTORE: s3
      OBJSTORE_LOCAL_DIR: /data/objects
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: uploads
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      DEV_MODE: "true"
      LOG_LEVEL: info
      # Overridable for acceptance runs (e.g. INCOMPLETE_TTL=30s CLEANUP_INTERVAL=5s make up).
      INCOMPLETE_TTL: ${INCOMPLETE_TTL:-168h}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1h}
      JWT_ALGS: ES256,HS256
      JWT_PUBLIC_KEY_FILE: /certs/jwt.pub
    # JWT_HMAC_SECRET (random, 32 bytes hex) generated by `make devcert`.
    env_file:
      - ../certs/jwt-hmac.env
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_HTTPS_PORT:-18443}:8443/tcp"
      - "${HOST_BIND:-127.0.0.1}:${HOST_HTTPS_PORT:-18443}:8443/udp"
      - "${HOST_BIND:-127.0.0.1}:${HOST_GRPC_PORT:-19090}:9090/tcp"
      - "${HOST_BIND:-127.0.0.1}:${HOST_METRICS_PORT:-19100}:9100/tcp"
    volumes:
      - ../certs:/certs:ro
      - staging:/data

  # The netem uploader service (deploy/netem) is added in M9.

networks:
  default:
    name: ${COMPOSE_NETWORK:-deploy_default}

volumes:
  pgdata:
  minio:
  staging:
